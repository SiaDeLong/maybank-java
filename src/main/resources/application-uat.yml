spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${DB_URL:jdbc:sqlserver://uat-db-host:1433;databaseName=demo_db_uat;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:YourPassword123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

app:
  log:
    directory: ${LOG_DIRECTORY:/var/log/demo}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.example.com,https://admin.example.com}

logging:
  level:
    root: WARN
    com.maybank.demo: INFO
    com.maybank.demo.exception: ERROR
    org.springframework.web: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
